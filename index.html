<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<title>Field Service Tracker</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232e7d32'/%3E%3Ctext x='50' y='58' font-size='42' text-anchor='middle' fill='white' font-family='Arial'%3EF%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{margin:0;background:#eef2f6;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.header{background:#2e7d32;color:white;text-align:center;padding:18px;font-size:20px;font-weight:600}
.section{padding:18px}
.card{background:#f7f7f7;padding:14px;border-radius:12px;margin-bottom:12px}
.dateBox{background:#e8f5e9;padding:12px;border-radius:10px;text-align:center;font-weight:600;margin-bottom:12px}
.row{display:flex;gap:10px}
.row input{flex:1}
input{width:100%;padding:14px;margin-bottom:10px;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#2e7d32;color:white;font-size:16px;font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stat{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;text-align:center;font-size:14px}
.stat b{display:block;margin-top:4px;font-size:16px}
.records{flex:1;overflow:auto;padding:16px;border-top:1px solid #eee}
.entry{background:#fafafa;padding:12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.entryRow{display:flex;justify-content:space-between;align-items:center}
.actions button{width:auto;padding:6px 10px;margin-left:5px;font-size:12px}
.actions .edit{background:#1976d2;color:white}
.actions .delete{background:#e53935;color:white}
.empty{text-align:center;color:#777;margin-top:30px}
.footer{padding:10px;text-align:center;font-size:12px;color:#888}
</style></head><body><div class="app"><div class="header">Field Service</div><div class="section"><div class="dateBox" id="todayDate"></div><div class="card">
<div class="row">
<input type="number" id="hours" placeholder="Hours">
<input type="number" id="minutes" placeholder="Minutes">
</div>
<button onclick="saveEntry()" id="saveBtn">Save Time</button>
</div><div class="stats">
<div class="stat">Today<b id="today">0h</b></div>
<div class="stat">Week<b id="week">0h</b></div>
<div class="stat">Month<b id="month">0h</b></div>
</div></div><div class="records" id="records"></div><div class="footer">Field Service Tracker</div></div><script>

let editIndex=null;

function istDate(){
let now=new Date();
let ist=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Kolkata"}));
return ist.toISOString().slice(0,10);
}

function formatDate(d){
let p=d.split("-");
return p[2]+"-"+p[1]+"-"+p[0];
}

function showDate(){
document.getElementById("todayDate").innerText="Today: "+formatDate(istDate());
}

function saveEntry(){
let h=parseInt(document.getElementById("hours").value)||0;
let m=parseInt(document.getElementById("minutes").value)||0;

if(h===0 && m===0){alert("Enter hours or minutes");return}

let totalMinutes=(h*60)+m;

let data=JSON.parse(localStorage.getItem("serviceData")||"[]");

if(editIndex!==null){
 data[editIndex].minutes=totalMinutes;
 editIndex=null;
 document.getElementById("saveBtn").innerText="Save Time";
}else{
 data.push({date:istDate(),minutes:totalMinutes});
}

localStorage.setItem("serviceData",JSON.stringify(data));

document.getElementById("hours").value="";
document.getElementById("minutes").value="";

load();
}

function editEntry(i){
let data=JSON.parse(localStorage.getItem("serviceData")||"[]");
let e=data[i];

let h=Math.floor(e.minutes/60);
let m=e.minutes%60;

 document.getElementById("hours").value=h;
 document.getElementById("minutes").value=m;

editIndex=i;

document.getElementById("saveBtn").innerText="Update Time";
}

function deleteEntry(i){
let data=JSON.parse(localStorage.getItem("serviceData")||"[]");
if(confirm("Delete this record?")){
 data.splice(i,1);
 localStorage.setItem("serviceData",JSON.stringify(data));
 load();
}
}

function format(m){
let h=Math.floor(m/60);
let mm=m%60;
if(h>0 && mm>0) return h+"h "+mm+"m";
if(h>0) return h+"h";
return mm+"m";
}

function load(){
let data=JSON.parse(localStorage.getItem("serviceData")||"[]");
let rec=document.getElementById("records");
rec.innerHTML="";

let todayMin=0,weekMin=0,monthMin=0;
let today=istDate();
let now=new Date();

let weekStart=new Date();
weekStart.setDate(now.getDate()-now.getDay());

for(let i=0;i<data.length;i++){
let d=data[i];

let div=document.createElement("div");
div.className="entry";

div.innerHTML=`
<div class="entryRow">
<span>${formatDate(d.date)} • ${format(d.minutes)}</span>
<div class="actions">
<button class="edit" onclick="editEntry(${i})">Edit</button>
<button class="delete" onclick="deleteEntry(${i})">Delete</button>
</div>
</div>`;

rec.appendChild(div);

if(d.date===today)todayMin+=d.minutes;

let ed=new Date(d.date);
if(ed>=weekStart)weekMin+=d.minutes;

if(ed.getMonth()===now.getMonth() && ed.getFullYear()===now.getFullYear())
monthMin+=d.minutes;
}

if(data.length===0)rec.innerHTML="<div class='empty'>No service records yet</div>";

 document.getElementById("today").innerText=format(todayMin);
 document.getElementById("week").innerText=format(weekMin);
 document.getElementById("month").innerText=format(monthMin);
}

showDate();
load();

/* PWA manifest */
const manifest={
 name:"Field Service Tracker",
 short_name:"Service",
 start_url:".",
 display:"standalone",
 background_color:"#ffffff",
 theme_color:"#2e7d32",
 icons:[{
  src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232e7d32'/%3E%3Ctext x='50' y='58' font-size='42' text-anchor='middle' fill='white' font-family='Arial'%3EF%3C/text%3E%3C/svg%3E",
  sizes:"192x192",
  type:"image/svg+xml"
 }]
};

const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
const manifestURL=URL.createObjectURL(blob);
const link=document.createElement('link');
link.rel='manifest';
link.href=manifestURL;
document.head.appendChild(link);

if('serviceWorker' in navigator){
 const swCode=`
 self.addEventListener('install',e=>self.skipWaiting());
 self.addEventListener('fetch',e=>{
  e.respondWith(fetch(e.request).catch(()=>new Response('Offline')));
 });`;
 const swBlob=new Blob([swCode],{type:'text/javascript'});
 const swURL=URL.createObjectURL(swBlob);
 navigator.serviceWorker.register(swURL);
}

</script></body>
</html>
